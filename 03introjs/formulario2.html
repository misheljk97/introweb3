<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>  nombres </h2>
    <form id="formulario">
        <table> 
            <tr> 
                <td> Nombres: </td> 
                <td>
                    <input id="txtNombre" type="text" required/> 
                </td>
            </tr>
             <tr>
                <td> apellido: </td>
                <td>
                    <input id="txtApellido" type="text" required/> 
                </td>
             </tr>
             <tr>
                <td> correo: </td>
                <td>
                    <input id="txtCorreo" type="email" required/> 
                </td>
             </tr>
             <tr> 
                <td> edad:</td> 
                <td> 
                    <input id="txtEdad" type="number" required/> <!-- el requerido es para que ningun campo quede vacio
                    y sea necerario llenar-->
                </td>
                <tr>
                <td> </td>
                <td>
                    <button  id="boton_registar"> registar </button>
                </td>
                </tr>
            </tr>
        </table>

    </form> 
    <h3> persona registrada</h3>
    <div id="resultado">ninguno </div>
</body>
</html>
<script>
    const form= document.getElementById("formulario");

    form.addEventListener('submit',function(e){
        e.preventDefault(); //evita que se recargue la pagina
        var nombres = document.getElementById("txtNombre").value;
        var apellido=document.getElementById("txtApellido").value;
        var correo = document.getElementById("txtCorreo").value;
        var edad = document.getElementById("txtEdad").value;

        var html ="<table border='1'>"+ "<tr>" +"<td> Nombres:<td/> "
            +" <td>"+nombres+" </tr> "+ "<tr>" +"<td> Apellido:<td/> "+" <td>"+apellido+" </tr>"+ 
                "<tr>" +"<td> correo:<td/> "+" <td>"+correo+" </tr>"
                + "<tr>" +"<td> edad:<td/> "+" <td>"+edad+" </tr>" + "<table>";
    

        document.getElementById("resultado").innerHTML= html
        //"Nombres: "+nombres +"<br/>"+
        //"Apellidos: "+apellido +"<br/>"
    });
</script>
