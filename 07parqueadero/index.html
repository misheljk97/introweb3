<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkSpot - Control & Registro de Parqueo</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Fondo Menta Pastel */
      background-color: #e8f5e9; 
      color: #334155;
    }
    .brand-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
    }
    .card-custom {
      border: none;
      border-radius: 16px;
      transition: all 0.3s ease;
    }
    .form-control, .form-select {
      border-radius: 10px;
      padding: 0.625rem 0.85rem;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus, .form-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
    }
    .input-group-text {
      border-radius: 10px 0 0 10px;
      background-color: #f8fafc;
      border-color: #cbd5e1;
      color: #64748b;
    }
    .input-group .form-control, .input-group .form-select {
      border-radius: 0 10px 10px 0;
    }
    .btn-primary-custom {
      background-color: #2563eb;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-primary-custom:hover {
      background-color: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-danger-custom {
      border-radius: 8px;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
    }
    .table-hover tbody tr:hover {
      background-color: rgba(37, 99, 235, 0.03);
    }
    .badge-vehiculo {
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.4em 0.75em;
      border-radius: 6px;
    }
  </style>
</head>
<body class="py-4 py-md-5">

  <div class="container">
    
    <!-- Encabezado / Branding -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-lg-10">
        <div class="brand-card card-custom p-4 shadow-sm text-center position-relative overflow-hidden">
          <div class="d-flex align-items-center justify-content-center gap-3">
            <div class="bg-primary p-3 rounded-circle d-inline-flex text-white shadow">
              <i class="bi bi-p-square-fill fs-2"></i>
            </div>
            <div class="text-start">
              <h1 class="h2 fw-bold mb-0">ParkSpot</h1>
              <p class="text-white-50 mb-0 small">Sistema Inteligente de Gestión & Control de Parqueo</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedor de Alertas -->
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10" id="alertContainer"></div>
    </div>

    <!-- Contenido Principal: Grilla Responsiva -->
    <div class="row justify-content-center g-4">
      
      <!-- Columna Izquierda: Formulario (col-12 col-md-5) -->
      <div class="col-12 col-md-5">
        <div class="card card-custom shadow-sm bg-white h-100">
          <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
            <div class="d-flex align-items-center gap-2 text-primary fw-bold">
              <i class="bi bi-plus-circle-fill fs-5"></i>
              <h5 class="card-title mb-0 text-dark fw-bold">Registrar Vehículo</h5>
            </div>
            <p class="text-muted small mb-0">Ingresa los datos del auto para iniciar tiempo</p>
          </div>
          
          <div class="card-body p-4">
            <form id="parkingForm" novalidate>
              
              <!-- Placa -->
              <div class="mb-3">
                <label for="placa" class="form-label small fw-semibold text-secondary">Placa del Vehículo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                  <input type="text" class="form-control" id="placa" placeholder="Ej. ABC-1234" required>
                </div>
              </div>

              <!-- Tipo de Vehículo -->
              <div class="mb-3">
                <label for="tipo" class="form-label small fw-semibold text-secondary">Tipo de Vehículo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-car-front"></i></span>
                  <select class="form-select" id="tipo" required>
                    <option value="" selected disabled>Seleccionar tipo...</option>
                    <option value="Automóvil">Automóvil</option>
                    <option value="Motocicleta">Motocicleta</option>
                    <option value="Camioneta">Camioneta</option>
                  </select>
                </div>
              </div>

              <!-- Cliente -->
              <div class="mb-3">
                <label for="cliente" class="form-label small fw-semibold text-secondary">Propietario / Cliente</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="cliente" placeholder="Nombre completo" required>
                </div>
              </div>

              <!-- Hora de Ingreso -->
              <div class="mb-4">
                <label for="horaIngreso" class="form-label small fw-semibold text-secondary">Hora de Ingreso</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-clock"></i></span>
                  <input type="time" class="form-control" id="horaIngreso" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-primary-custom w-100 shadow-sm d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-in-right fs-5"></i>
                Registrar Ingreso
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Tabla de Registro (col-12 col-md-7) -->
      <div class="col-12 col-md-7">
        <div class="card card-custom shadow-sm bg-white h-100">
          <div class="card-header bg-transparent border-0 pt-4 px-4 pb-2 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2 text-dark fw-bold">
              <i class="bi bi-list-task fs-5 text-primary"></i>
              <h5 class="card-title mb-0 fw-bold">Vehículos Parqueados</h5>
            </div>
            <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-normal" id="contadorVehiculos">
              <i class="bi bi-car-front-fill me-1 text-primary"></i> 0 Ocupados
            </span>
          </div>

          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 text-center border-top">
                <thead class="table-light text-secondary small text-uppercase">
                  <tr>
                    <th scope="col" class="py-3 ps-4 text-start">Placa</th>
                    <th scope="col" class="py-3">Tipo</th>
                    <th scope="col" class="py-3">Cliente</th>
                    <th scope="col" class="py-3">Hora</th>
                    <th scope="col" class="py-3 text-end pe-4">Acción</th>
                  </tr>
                </thead>
                <tbody id="tablaVehiculos" class="border-top-0">
                  <!-- Filas agregadas dinámicamente -->
                </tbody>
              </table>
            </div>

            <!-- Estado vacio -->
            <div id="emptyState" class="text-center py-5">
              <i class="bi bi-inbox text-muted display-6"></i>
              <p class="text-muted small mt-2 mb-0">No hay vehículos registrados en este momento.</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
